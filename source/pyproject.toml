[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aml-cycle-benchmark"
version = "0.2.0"
description = "Event-preserving cycle-membership benchmark on controlled AMLSim worlds, with summary and relational baselines"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
# Exact, tested pins are in requirements-models.txt and requirements-supplement.txt.
dependencies = [
    "numpy>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.5",
    "torch>=2.2",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# Earlier exploratory AMLworld/Elliptic/persistent-homology modules under src/ (not used by the benchmark paper).
legacy = [
    "networkx>=3.0",
    "pandas>=2.0",
    "gudhi>=3.8",
    "pyarrow>=12.0",
]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 110
target-version = ["py310"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
# Pyflakes (undefined names, unused imports/variables) and pycodestyle errors.
select = ["E", "F"]
# F841: some unused locals document intermediate quantities in research code; reviewed, kept.
ignore = ["E501", "E731", "E741", "F841"]

[tool.ruff.lint.per-file-ignores]
# Entry scripts put the package directory on sys.path before importing it.
"scripts/*.py" = ["E402"]
