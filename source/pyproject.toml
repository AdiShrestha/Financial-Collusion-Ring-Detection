[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "toporing-engine"
version = "0.1.0"
description = "Topological Deep Learning for Anti-Money Laundering Ring Detection"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "networkx>=3.0",
    "scikit-learn>=1.2",
    "torch>=2.0",
    "pandas>=2.0",
    "matplotlib",
    "gudhi>=3.8",
    "pyarrow>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
